<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Proses merangkai bunga</title>
  <desc id="desc">Ilustrasi florist sedang merangkai bunga menjadi buket.</desc>

  <!-- Background -->
  <rect width="640" height="360" fill="#fdf2f4"/>

  <!-- Table -->
  <rect x="80" y="285" width="480" height="18" rx="8" fill="#8d5a3b"/>

  <!-- Florist body -->
  <path d="M420 175c55 5 90 40 95 110H385c5-55 10-100 35-110z"
        fill="#8fa58a"/>

  <!-- Head -->
  <circle cx="430" cy="105" r="38" fill="#f2c7a5"/>

  <!-- Hair -->
  <path d="M395 105c0-35 25-55 55-45 25 8 28 35 20 55-12-18-28-25-50-18-8 8-15 12-25 8z"
        fill="#40513b"/>

  <!-- Arm -->
  <path d="M405 190c-45 15-70 45-85 80"
        fill="none"
        stroke="#f2c7a5"
        stroke-width="20"
        stroke-linecap="round"/>

  <!-- Hand -->
  <circle cx="320" cy="270" r="13" fill="#f2c7a5"/>

  <!-- Flower stems being arranged -->
  <path d="M320 270c-10-45-15-90-35-125"
        fill="none"
        stroke="#40513b"
        stroke-width="7"
        stroke-linecap="round"/>

  <path d="M325 270c10-50 25-85 55-120"
        fill="none"
        stroke="#40513b"
        stroke-width="7"
        stroke-linecap="round"/>

  <path d="M325 270c-35-40-55-55-80-60"
        fill="none"
        stroke="#40513b"
        stroke-width="7"
        stroke-linecap="round"/>

  <!-- Flowers -->
  <circle cx="285" cy="140" r="22" fill="#d96868"/>
  <circle cx="265" cy="150" r="17" fill="#e88b8b"/>
  <circle cx="305" cy="155" r="17" fill="#e88b8b"/>
  <circle cx="285" cy="155" r="10" fill="#f4c95d"/>

  <circle cx="375" cy="145" r="22" fill="#d96868"/>
  <circle cx="357" cy="155" r="17" fill="#e88b8b"/>
  <circle cx="393" cy="160" r="17" fill="#e88b8b"/>
  <circle cx="375" cy="160" r="10" fill="#f4c95d"/>

  <!-- Leaves -->
  <path d="M300 220c-30-25-55-20-65-5 25 5 45 15 65 5z"
        fill="#8fa58a"/>
  <path d="M350 215c25-25 50-20 60-5-25 5-40 15-60 5z"
        fill="#8fa58a"/>

  <!-- Scissors on table -->
  <circle cx="150" cy="275" r="12" fill="none"
        stroke="#64748b" stroke-width="7"/>
  <circle cx="180" cy="275" r="12" fill="none"
        stroke="#64748b" stroke-width="7"/>
  <path d="M158 270l55-35M188 270l25-35"
        stroke="#64748b" stroke-width="6"
        stroke-linecap="round"/>

  <!-- Loose flowers -->
  <path d="M120 275c15-35 20-55 20-75"
        stroke="#40513b" stroke-width="5" fill="none"/>
  <circle cx="140" cy="195" r="15" fill="#e88b8b"/>

  <!-- Ribbon -->
  <path d="M300 265c-20 15-35 20-50 8 5 22 30 28 50 8z"
        fill="#d96868"/>
  <path d="M330 265c20 15 35 20 50 8-5 22-30 28-50 8z"
        fill="#d96868"/>
</svg>