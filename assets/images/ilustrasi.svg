<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Etalase Florist</title>
  <desc id="desc">Ilustrasi dua rangkaian bunga.</desc>

  <!-- Background -->
  <rect width="640" height="360" fill="#F4F1E8" />

  <!-- Meja -->
  <rect y="260" width="640" height="100" fill="#8FA58A" />

  <!-- Bunga produk 1 -->
  <g fill="#40513B">
    <circle cx="220" cy="120" r="50" />
    <circle cx="185" cy="155" r="32" />
    <circle cx="255" cy="155" r="32" />
  </g>

  <!-- Batang produk 1 -->
  <rect x="215" y="155" width="10" height="105" fill="#8FA58A" />

  <!-- Bunga produk 2 -->
  <g fill="#40513B">
    <circle cx="420" cy="110" r="55" />
    <circle cx="385" cy="150" r="34" />
    <circle cx="455" cy="150" r="34" />
  </g>

  <!-- Batang produk 2 -->
  <rect x="415" y="155" width="10" height="105" fill="#8FA58A" />

  <!-- Nama produk -->
  <g fill="#40513B"
     font-family="Arial, sans-serif"
     font-size="22"
     font-weight="700"
     text-anchor="middle">
    <text x="220" y="220">Fresh Flowers</text>
    <text x="420" y="220">Bouquets</text>
  </g>
</svg>